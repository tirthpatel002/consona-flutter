name: consona_flutter
description: A subtle, minimal, tactile, softly animated multi-platform Flutter component library and logic foundation.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  audioplayers: ^6.8.1
  record: ^6.2.1
  video_player: ^2.14.1
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  path: ^1.9.0
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
